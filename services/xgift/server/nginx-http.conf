# Pre-cutover: no login or business APIs are available over plain HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name x-api.gptibo.com;
    client_max_body_size 16k;
    location /.well-known/acme-challenge/ { root /var/www/xgift-acme; }
    location = /healthz {
        proxy_set_header Host x-api.gptibo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8791;
    }
    location / { return 503; }
}
