server {
    listen 80;
    listen [::]:80;
    server_name x-api.gptibo.com;
    location /.well-known/acme-challenge/ { root /var/www/xgift-acme; }
    location / { return 301 https://x-api.gptibo.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name x-api.gptibo.com;
    ssl_certificate /etc/letsencrypt/live/x-api.gptibo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/x-api.gptibo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /.well-known/acme-challenge/ { root /var/www/xgift-acme; }
    location / {
        proxy_set_header Host x-api.gptibo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        proxy_pass http://127.0.0.1:8791;
        proxy_read_timeout 65s;
    }
}
