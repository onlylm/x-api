# Isolated partner gateway only. Included inside x.aifu.me HTTPS server.
location = /partner { return 404; }

location = /partner/health {
    if ($request_method !~ ^(GET|HEAD)$) { return 404; }
    proxy_pass http://127.0.0.1:3110/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 30s;
}

location ~ ^/partner/api/v1/checkout/(?:products|orders(?:/[A-Za-z0-9_-]+(?:/(?:activate|activation|refund))?)?)$ {
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 404; }
    rewrite ^/partner(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 45s;
    client_max_body_size 16k;
}

location ~ ^/partner/payment-qr/[A-Za-z0-9_-]+\.png$ {
    if ($request_method !~ ^(GET|HEAD)$) { return 404; }
    rewrite ^/partner(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 30s;
}

location = /partner/callbacks/alipay {
    if ($request_method != POST) { return 404; }
    proxy_pass http://127.0.0.1:3110/callbacks/alipay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}

location /partner/ { return 404; }
