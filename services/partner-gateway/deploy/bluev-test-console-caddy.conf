# Insert INSIDE the existing api.quefa.cn route, before legacy handles.
@bluev_test_shell {
  method GET HEAD
  path /admin /admin/
}
handle @bluev_test_shell {
  # Both GET/HEAD shell paths have the same original /admin document.
  # Only these read requests may fail over; business APIs never enter this block.
  reverse_proxy bluev-test-console:3114 app_finance:3100 {
    rewrite /admin
    lb_policy first
    lb_try_duration 4s
    lb_try_interval 100ms
    lb_retry_match method GET HEAD
    fail_duration 2s
    max_fails 1
    unhealthy_status 5xx
    transport http {
      dial_timeout 1s
      response_header_timeout 3s
    }
    @shell_failed status 5xx
    handle_response @shell_failed {
      reverse_proxy app_finance:3100 {
        rewrite /admin
      }
    }
  }
}
@bluev_test_only {
  path /admin/bluev-test /admin/bluev-test/ /admin/api/bluev-test /admin/api/bluev-test/*
}
handle @bluev_test_only {
  reverse_proxy bluev-test-console:3114
}
