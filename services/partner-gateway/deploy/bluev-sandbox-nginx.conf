# Only the independent sandbox namespace is exposed. Legacy routes remain intact.
location = /bluev-sandbox/callbacks/alipay {
    if ($request_method != POST) { return 405; }
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3112/callbacks/alipay;
    proxy_set_header Host x.aifu.me;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
    add_header Cache-Control "no-store" always;
}
location ^~ /bluev-sandbox/internal/bluev-test/ {
    allow 154.198.43.105;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3112/internal/bluev-test/;
    proxy_set_header Host x.aifu.me;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store" always;
}
location = /bluev-sandbox { return 404; }
location /bluev-sandbox/ { return 404; }
